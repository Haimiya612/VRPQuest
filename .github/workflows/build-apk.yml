name: Build Rookie Quest

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Rclone Android ARM64
        run: |
          set -euo pipefail

          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl --fail --location --retry 3 \
            "https://beta.rclone.org/v1.75.0/testbuilds/rclone-android-21-armv8a.gz" \
            --output /tmp/rclone-android.gz

          gzip -dc /tmp/rclone-android.gz \
            > app/src/main/jniLibs/arm64-v8a/librclone.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/librclone.so

          file app/src/main/jniLibs/arm64-v8a/librclone.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rookie-Quest-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14